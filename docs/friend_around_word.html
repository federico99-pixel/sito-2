<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Friends Around the World</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        :root {
            --rosso: #b5122b;
            --rosso-scuro: #7f0d1e;
            --bianco: #ffffff;
            --testo: #202020;
            --sfondo-chiaro: #f7f7f7;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--testo);
            background-color: var(--sfondo-chiaro);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =================================
           HERO E CAROSELLO
        ================================= */

        .friends-hero-slider {
            position: relative;
            width: 100%;
            height: 50vh;
            min-height: 350px;
            overflow: hidden;
            background-color: var(--rosso-scuro);
        }

        /* Pulsante per tornare alla home */
        .back-home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 30;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 18px;

            color: var(--bianco);
            background-color: rgba(0, 0, 0, 0.45);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;

            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            transition:
                background-color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .back-home-btn:hover {
            color: var(--bianco);
            background-color: var(--rosso);
            border-color: var(--rosso);
            transform: translateY(-2px);
        }

        .back-home-btn:focus-visible {
            outline: 3px solid var(--bianco);
            outline-offset: 3px;
        }

        /*
            Sei slide:
            cinque fotografie più la copia finale della Terra.
        */
        .slider-track {
            display: flex;
            width: 600%;
            height: 100%;

            animation: slide-animation 24s infinite ease-in-out;
            will-change: transform;
        }

        .slide {
            width: 16.6667%;
            height: 100%;
            flex-shrink: 0;

            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        @keyframes slide-animation {
            0%,
            13% {
                transform: translateX(0);
            }

            17%,
            30% {
                transform: translateX(-16.6667%);
            }

            34%,
            47% {
                transform: translateX(-33.3333%);
            }

            51%,
            64% {
                transform: translateX(-50%);
            }

            68%,
            81% {
                transform: translateX(-66.6667%);
            }

            85%,
            100% {
                transform: translateX(-83.3333%);
            }
        }

        /* Overlay sopra le fotografie */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 5rem 2rem 2rem;

            color: var(--bianco);
            text-align: center;

            background: linear-gradient(
                rgba(181, 18, 43, 0.58),
                rgba(127, 13, 30, 0.86)
            );

            /*
                Permette di cliccare il pulsante,
                anche se l'overlay copre tutto l'header.
            */
            pointer-events: none;
        }

        .hero-overlay h1 {
            max-width: 1100px;
            margin: 0;

            font-size: clamp(2.3rem, 6vw, 5rem);
            line-height: 1.05;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
        }

        .hero-overlay p {
            max-width: 650px;
            margin: 1rem 0 0;

            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.5;
        }

        /* =================================
           SEZIONE MAPPA
        ================================= */

        .map-section {
            padding: 4rem 5%;
            background-color: var(--bianco);
        }

        .map-heading {
            max-width: 750px;
            margin-bottom: 2rem;
        }

        .map-heading p {
            margin: 0 0 0.5rem;

            color: var(--rosso);
            font-weight: 700;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
        }

        .map-heading h2 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
        }

        #map {
            width: 100%;
            height: 500px;

            border: 3px solid var(--rosso);
            border-radius: 24px;

            background-color: #dddddd;
            overflow: hidden;
        }

        /* Rimuove lo sfondo predefinito dell’icona Leaflet */
        .pushpin-marker {
            background: transparent;
            border: none;
        }

        /* =================================
           VERSIONE MOBILE
        ================================= */

        @media (max-width: 768px) {
            .friends-hero-slider {
                height: 45vh;
                min-height: 320px;
            }

            .back-home-btn {
                top: 12px;
                left: 12px;
                padding: 7px 13px;
                font-size: 0.85rem;
            }

            .hero-overlay {
                padding: 5rem 1.25rem 2rem;
            }

            .map-section {
                padding: 2.5rem 5%;
            }

            #map {
                height: 380px;
                border-radius: 16px;
            }
        }

        /* Disattiva il carosello se l’utente limita le animazioni */
        @media (prefers-reduced-motion: reduce) {
            .slider-track {
                animation: none;
            }

            .back-home-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         HERO CON FOTO SCORREVOLI
    ================================= -->

    <header class="friends-hero-slider">

        <!-- I due file HTML devono essere nella stessa cartella -->
        <a href="./index.html">
            &#8592; Back Home class="back-home-btn"
            </a>

        <div class="slider-track">

            <!-- 1. Terra -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg');
                "
            ></div>

            <!-- 2. Londra -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Tower_Bridge_from_Shad_Thames.jpg?width=1600');
                "
            ></div>

            <!-- 3. Torino -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Mole_Antonelliana_Torino.jpg?width=1600');
                "
            ></div>

            <!-- 4. Sheffield -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Sheffield_Town_Hall_%2827475677653%29.jpg?width=1600');
                "
            ></div>

            <!-- 5. Agrate Brianza -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Chiesa_S.Eusebio.jpg?width=1600');
                "
            ></div>

            <!-- 6. Copia della Terra per chiudere il ciclo -->
            <div
                class="slide"
                style="
                    background-image:
                    url('https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg');
                "
            ></div>

        </div>

        <div class="hero-overlay">
            <h1>Friends Around the World</h1>

            <p>
                Our global scientific collaborations and partner locations.
            </p>
        </div>

    </header>

    <!-- =================================
         MAPPA
    ================================= -->

    <main class="map-section">

        <div class="map-heading">
            <p>Explore our connections</p>
            <h2>Our international network</h2>
        </div>

        <div
            id="map"
            role="region"
            aria-label="Map of international scientific collaborations"
        ></div>

    </main>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        /* Limiti geografici del mondo */
        const worldBounds = L.latLngBounds(
            [-85.0511, -180],
            [85.0511, 180]
        );

        /* Creazione della mappa */
        const map = L.map("map", {
            minZoom: 1,
            maxZoom: 18,
            maxBounds: worldBounds,
            maxBoundsViscosity: 1,
            worldCopyJump: false
        }).setView([48, 4], 4);

        /* Mappa CartoDB chiara */
        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            {
                subdomains: "abcd",
                minZoom: 1,
                maxZoom: 18,
                bounds: worldBounds,
                noWrap: true,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    'OpenStreetMap</a> contributors ' +
                    '&copy; <a href="https://carto.com/attributions">' +
                    'CARTO</a>'
            }
        ).addTo(map);

        /*
            Calcola il minimo zoom in base alle dimensioni
            effettive della mappa, evitando zone grigie.
        */
        function updateMinimumZoom() {
            map.setMinZoom(0);

            const minimumZoom = map.getBoundsZoom(
                worldBounds,
                true
            );

            map.setMinZoom(minimumZoom);

            if (map.getZoom() < minimumZoom) {
                map.setZoom(minimumZoom);
            }
        }

        map.whenReady(() => {
            map.invalidateSize();
            updateMinimumZoom();
        });

        window.addEventListener("resize", () => {
            map.invalidateSize();
            updateMinimumZoom();
        });

        /* Icona personalizzata dei marker */
        const pushpinIcon = L.divIcon({
            className: "pushpin-marker",

            html: `
                <svg
                    width="30"
                    height="30"
                    viewBox="0 0 24 24"
                    fill="#e74c3c"
                    stroke="#900c3f"
                    stroke-width="1.5"
                    aria-hidden="true"
                >
                    <path
                        d="
                            M16 4v3.586l1.707 1.707
                            A1 1 0 0 1 18 10v2
                            a1 1 0 0 1-1 1h-4v7
                            l-1 2-1-2v-7H7
                            a1 1 0 0 1-1-1v-2
                            a1 1 0 0 1 .293-.707
                            L8 7.586V4h8z
                        "
                    />
                </svg>
            `,

            iconSize: [30, 30],
            iconAnchor: [15, 29],
            popupAnchor: [0, -28]
        });

        /* Coordinate delle sedi */
        const locations = {
            chimicaTorino: [45.0531, 7.6796],
            imperialCollege: [51.4984, -0.1782],
            cnrAgrate: [45.5786, 9.3621],
            inrimTorino: [45.0167, 7.6414],
            sheffield: [53.3808, -1.4889]
        };

        /* Marker Torino */
        L.marker(
            locations.chimicaTorino,
            { icon: pushpinIcon }
        )
            .addTo(map)
            .bindPopup(
                "<b>Department of Chemistry</b><br>" +
                "University of Turin"
            );

        /* Marker Imperial College */
        L.marker(
            locations.imperialCollege,
            { icon: pushpinIcon }
        )
            .addTo(map)
            .bindPopup(
                "<b>Imperial College London</b><br>" +
                "London"
            );

        /* Marker CNR-IMM */
        L.marker(
            locations.cnrAgrate,
            { icon: pushpinIcon }
        )
            .addTo(map)
            .bindPopup(
                "<b>CNR-IMM</b><br>" +
                "Agrate Brianza"
            );

        /* Marker INRiM */
        L.marker(
            locations.inrimTorino,
            { icon: pushpinIcon }
        )
            .addTo(map)
            .bindPopup(
                "<b>INRiM</b><br>" +
                "Turin"
            );

        /* Marker Sheffield */
        L.marker(
            locations.sheffield,
            { icon: pushpinIcon }
        )
            .addTo(map)
            .bindPopup(
                "<b>University of Sheffield</b><br>" +
                "Sheffield"
            );

        /* Linee di collegamento con Torino */
        const connectionLines = [
            [
                locations.chimicaTorino,
                locations.imperialCollege
            ],
            [
                locations.chimicaTorino,
                locations.cnrAgrate
            ],
            [
                locations.chimicaTorino,
                locations.inrimTorino
            ],
            [
                locations.chimicaTorino,
                locations.sheffield
            ]
        ];

        connectionLines.forEach((coordinates) => {
            L.polyline(coordinates, {
                color: "#b5122b",
                weight: 2,
                opacity: 0.8,
                dashArray: "6, 6"
            }).addTo(map);
        });
    </script>

</body>

</html>
